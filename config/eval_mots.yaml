# Les recherches les plus courantes sur un site de sorties (15/10/2026) : 125.
#
# Deuxième jeu d'évaluation de la recherche, à côté des 50 questions de
# config/eval_recherche.yaml : ici, des recherches courtes, comme les tapent
# les visiteurs (un mot, deux au plus), dans toutes les rubriques d'un agenda
# de sorties.
#
# D'où vient la liste : elle ne vient PAS d'une mesure. SortirIA n'a pas
# encore d'utilisateurs ; la liste reprend les rubriques et les mots-clés
# courants des agendas de sorties (OpenAgenda, agendas des offices de
# tourisme et des villes, sites de sorties grand public) et quelques
# spécialités locales (joutes, huîtres), puis (le soir) une liste d'activités
# de loisirs et de sorties du soir : bowling, laser game, padel, rooftop…
# Beaucoup de ces dernières sont des LIEUX ouverts toute l'année, pas des
# événements datés : un agenda n'en parle que lors d'un événement (tournoi,
# soirée). Leur absence mesure ce que la base ne couvre pas. Elle sera remplacée, ou complétée,
# par les mots réellement tapés : journal rag_requests, bilan du lundi de
# l'agent (uv run python -m agent --bilan-recherche).
#
# Lancement :
#     uv run python -m scripts.eval_recherche --fichier config/eval_mots.yaml
#
# Même format que config/eval_recherche.yaml :
#   compris  ce que la recherche doit comprendre (type, public, quand…) ;
#   mots     au moins un de ces mots doit figurer dans chaque proposition
#            (titre, résumé ou lieu) : c'est la pertinence par le contenu.
# Un mot absent de la base n'est pas une erreur de la recherche : la réponse
# le dit (« idées voisines » ou « rien sur ce sujet »), compté à part.

