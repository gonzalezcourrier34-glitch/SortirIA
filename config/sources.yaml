# Contrat des sources SortirIA.
#
# Provenance : format repris de CheckIt.AI (projet 12). Les sources de presse
# et de fake news de CheckIt.AI ont été retirées : SortirIA ne collecte que
# des événements (sorties à Montpellier).
#
# Les valeurs communes sont centralisées dans defaults. config/source_config.py
# fusionne ces valeurs avec chaque source, puis valide le contrat avant le
# lancement des extracteurs.

defaults:
  common:
    enabled: true
    language: "fr"
    country: "France"
    category: "evenement"
    max_articles: 500
    # Fenêtre de collecte commune à toutes les sources (14/10/2026) : les
    # 3 prochains mois, ce que le RAG peut proposer (vue v_upcoming_events).
    # La base est plafonnée à 10 000 événements (SORTIRIA_MAX_EVENEMENTS).
    days_forward: 90

  ical:
    role: "acquisition"

  document:
    role: "acquisition"

  api:
    role: "acquisition"
    pagination:
      enabled: false
      parameter: "page"
      start: 1
      max_pages: 1
      page_size_parameter: null
      page_size: null

  rss:
    role: "acquisition"

  # Jeux de données ouverts (CSV, JSON), par exemple l'open data de la Métropole.
  dataset:
    role: "acquisition"
    chunksize: 10000

  # Pages d'agenda : uniquement les sites dont le robots.txt et les CGU
  # autorisent la collecte.
  scraper:
    role: "acquisition"
    respect_robots_txt: true
    request_delay_seconds: 1.0

  filters:
    acquisition:
      require_title: true
      require_text: false
      require_image: false
      require_url: true
      require_label: false
      min_title_length: 3
      min_text_length: 0
      # Hérité de CheckIt.AI (articles de presse) : 10. Pour un événement, le
      # titre suffit (« Hamlet », sans description dans un calendrier iCal).
      min_total_text_length: 3
      remove_deleted_content: true
      # false (15/10/2026) : le moteur CheckIt.AI tenait pour doublon « même titre,
      # même jour » (articles de presse), ce qui fusionnait « Marché » à Mèze et à
      # Marseillan. Les extracteurs dédoublonnent par identifiant (uid, uuid) et la
      # chaîne d'événements par titre + jour + lieu.
      remove_duplicates: false
      validate_urls: true
      allowed_labels: []


# ---------------------------------------------------------------------------
# Sources d'événements
# ---------------------------------------------------------------------------

api_sources:
  # Extracteur : src/extractors/apis/source/openagenda_extractor.py
  # Clé : OPENAGENDA_API_KEY dans .env (ou secret openagenda_api_key).
  - name: "OpenAgenda - Montpellier et bassin de Thau"
    source_id: "openagenda"
    type: "api"
    role: "acquisition"
    endpoint: "https://openagenda.com/agendas"
    agendas_search_url: "https://api.openagenda.com/v2/agendas"
    api_key_secret_name: "openagenda_api_key"
    zone: "Montpellier"
    # Zones couvertes : on ne garde que les événements situés dans l'une d'elles
    # (la recherche d'agendas renvoie aussi des agendas nationaux).
    # L'ancre &zones permet à DATAtourisme de réutiliser exactement les mêmes zones.
    areas: &zones
      - name: "Montpellier et sa métropole"
        latitude: 43.6108
        longitude: 3.8767
        radius_km: 20
      - name: "Bassin de Thau (Sète, Frontignan, Balaruc, Mèze, Marseillan...)"
        latitude: 43.42
        longitude: 3.62
        radius_km: 15
    # Sans coordonnées GPS, on compare le nom de la ville à cette liste.
    cities: ["Montpellier", "Lattes", "Castelnau-le-Lez", "Pérols", "Saint-Jean-de-Védas",
             "Juvignac", "Grabels", "Clapiers", "Jacou", "Le Crès", "Vendargues", "Castries",
             "Fabrègues", "Palavas-les-Flots", "Carnon", "Mauguio",
             "Sète", "Frontignan", "Balaruc-les-Bains", "Balaruc-le-Vieux", "Bouzigues",
             "Mèze", "Marseillan", "Loupian", "Poussan", "Gigean", "Vic-la-Gardiole"]
    # Termes de recherche des agendas (les agendas trouvés sont fusionnés).
    search_terms: ["Montpellier", "Hérault", "Montpellier Méditerranée Métropole", "Sète", "Thau"]
    # Agendas lus chaque nuit. L'audit du 14/10/2026 a montré que la recherche
    # par termes lit ~10 000 événements (111 agendas, souvent nationaux) pour
    # en garder 83 dans la zone, en 6 minutes. Ces 11 agendas fournissent tous
    # les événements retenus : la collecte de nuit ne lit qu'eux.
    # Liste vide = recherche par termes (mode découverte).
    # Chaque semaine (discovery_weekday : 0 = lundi … 6 = dimanche), l'agent
    # refait la recherche complète et propose les agendas utiles absents de
    # cette liste (table agent_proposals, mail de bilan). Pour décider :
    # uv run python -m agent.proposals (--accepter N ajoute l'agenda ici).
    # Découverte à la demande : uv run python -m agent --decouverte.
    discovery_weekday: 6
    agenda_uids:
      - "9969608"    # 30 événements retenus le 14/10
      - "4838751"    # 12
      - "35944609"   # 10
      - "38495884"   # 10
      - "1854436"    # 9
      - "35777956"   # 4
      - "59738311"   # 3
      - "82566953"   # 2
      - "65401129"   # 1
      - "70214399"   # 1
      - "10455523"   # 1
      - "67871262"   # 1 (repéré par la collecte du 14/10 à 11 h)
    max_agendas: 50
    page_size: 100
    max_pages: 10
    max_articles: 2000

  # Offices de tourisme (DATAtourisme, Licence Ouverte 2.0). Ajouté le
  # 14/10/2026 : 735 événements autour de Montpellier, 296 sur le bassin de
  # Thau, contre ~80 pour OpenAgenda.
  - name: "DATAtourisme - Montpellier et bassin de Thau"
    source_id: "datatourisme"
    type: "api"
    role: "acquisition"
    endpoint: "https://api.datatourisme.fr/v1/entertainmentAndEvent"
    api_key_secret_name: "datatourisme_api_key"
    zone: "Montpellier"
    areas: *zones
    page_size: 100
    max_pages: 20
    max_articles: 8000           # une séance = un événement : 3 mois de séances

# Flux RSS d'agenda (moteur RSS de CheckIt.AI, adaptateur
# src/extractors/rss/source/event_rss_extractor.py). Seulement des flux dont
# l'éditeur autorise la reprise (flux prévu pour la syndication, partenaire),
# robots.txt respecté. Vérifiés le 14/10/2026 et écartés : Démosphère Hérault
# (flux vide), Agenda du Libre (robots.txt l'interdit). Exemple :
#   - name: "Nom du lieu"
#     source_id: "nom_du_lieu"
#     type: "rss"
#     url: "https://exemple.fr/agenda/feed/"
#     event_date: "published"   # pubDate = date de l'événement (WordPress « The Events Calendar »)
#     venue_name: "Nom du lieu"
#     city: "Sète"
#     credit: "Nom du lieu"
rss_sources: []

# Calendriers iCal (.ics) des lieux partenaires : une entrée par lieu, sans
# code à écrire (moteur générique src/extractors/ical/). Exemple :
#
#   - name: "Nom du lieu"
#     source_id: "nom_du_lieu"          # identifiant unique, en snake_case
#     type: "ical"
#     url: "https://exemple.fr/agenda.ics"
#     venue_name: "Nom du lieu"          # lieu par défaut des événements
#     address: "1 rue Exemple"
#     city: "Montpellier"
#     postal_code: "34000"
#     latitude: 43.61
#     longitude: 3.87
#     website: "https://exemple.fr"      # lien si un événement n'en a pas
#     credit: "Nom du lieu"              # cité sous chaque proposition
#     max_articles: 500
ical_sources: []

# Programmes publiés en PDF, lus par Mistral (src/extractors/documents/).
# Le PDF n'est relu par Mistral que s'il a changé (cache par empreinte).
# Seul le texte est repris (titres, dates, lieux, prix), jamais les photos.
document_sources:
  - name: "Sète agglopôle - Agenda Culture sept.-déc. 2026"
    source_id: "agglopole_agenda_culture"
    type: "document"
    url: "https://www.agglopole.fr/wp-content/uploads/2026/09/Agenda-Culture-de-Sete-agglopole-mediterranee-de-Septembre-a-Decembre-2026.pdf"
    credit: "Sète agglopôle méditerranée, Agenda Culture sept.-déc. 2026"
    published_on: "2026-09-01"
    period: {debut: "2026-09-01", fin: "2026-12-31"}
    city: "Sète"                 # commune par défaut si ni le texte ni le lieu ne la donnent
    # Pages lues (vérifiées sur le texte le 14/10) : 1-3 = couverture, sommaire,
    # édito ; 60-62 et 64 = horaires des lieux ; 63 = résidences d'artistes (gardée).
    pages: "4-59,63"
    pages_per_chunk: 4
    pages_overlap: 1             # une séance qui continue page suivante garde son titre
    max_articles: 500
    # Commune de chaque lieu, d'après les pages pratiques du programme.
    venues:
      "Médiathèque François Mitterrand": "Sète"
      "Médiathèque André Malraux": "Sète"
      "Conservatoire Manitas de Plata": "Sète"
      "CRAC": "Sète"
      "Médiathèque Olympe de Gouges": "Balaruc-les-Bains"
      "Jardin antique méditerranéen": "Balaruc-les-Bains"
      "Médiathèque Montaigne": "Frontignan"
      "Médiathèque La Fabrique": "Marseillan"
      "Médiathèque Andrée Chedid": "Mèze"
      "Villa Loupian": "Loupian"
      "Musée de l'étang de Thau": "Bouzigues"
      "Musée étang de Thau": "Bouzigues"
    # Vacances scolaires (activités « hors vacances scolaires ») : dates
    # officielles service-public.fr, toutes zones. Provisoire : viendront du jeu
    # de données « calendrier scolaire » (prochaine méthode de collecte).
    school_holidays:
      - {debut: "2026-10-17", fin: "2026-11-01"}
      - {debut: "2026-12-19", fin: "2027-01-03"}

# Jeux de données lus par le moteur datasets de CheckIt.AI.
datasets:
  # Fichiers envoyés par les partenaires (src/extractors/datasets/source/partner_extractor.py).
  # UN FICHIER PAR PARTENAIRE, À LA RACINE de data/partenaires/, nommé d'après
  # lui (saintlouis.xlsx, bar_truc_muche.csv, festival.json) : tout ce qui est à
  # la racine est importé chaque nuit. Sous-dossiers et fichiers « _... » ignorés.
  # Modèle à envoyer : docs/modeles/modele_partenaire.xlsx (ou .csv).
  # Vérifier un fichier reçu :
  #   uv run python -m src.extractors.datasets.source.partner_extractor --verifier <fichier>
  - name: "Fichiers des partenaires"
    source_id: "partenaire"
    type: "dataset"
    path: "data/partenaires"
    format: "tableur"            # .xlsx, .xls, .csv ou .json
    chunksize: 1000
    max_articles: 3000
    filters:                     # mêmes règles que les autres sources d'événements
      require_label: false       # (le moteur datasets de CheckIt.AI exigeait un label vrai/faux)
      require_url: true
      min_title_length: 3
      min_text_length: 0
      min_total_text_length: 3
    # Réglages FACULTATIFS par partenaire (clé file = nom du fichier sans
    # extension). Sans entrée : nom tiré du fichier, secteur « autre », pas de
    # mise en avant, et chaque ligne doit avoir son lien.
    partners:
      # Partenaires FICTIFS de démonstration (14/10/2026) : séances marquées
      # « (exemple) », liens example.org. Passer enabled à false (ou retirer
      # leurs fichiers) avant d'ouvrir le service au public.
      - file: "ludotheque_exemple"
        name: "Ludothèque Exemple (fictif)"
        sector: "enfants"
        website: "https://example.org/ludotheque"
        sponsored_until: "2026-11-30"   # mis en avant jusqu'à cette date
        enabled: true
      - file: "bar_exemple"
        name: "Bar Exemple (fictif)"
        sector: "soiree"
        website: "https://example.org/bar"
        enabled: true
      - file: "festival_exemple"
        name: "Festival Exemple (fictif)"
        sector: "culture"
        website: "https://example.org/festival"
        enabled: true

# Pages d'agenda lues par le moteur scraper de CheckIt.AI (adaptateur
# src/extractors/scrapers/source/agenda_scraper.py, sélecteurs CSS ci-dessous).
# RÈGLE : seulement avec l'autorisation écrite de l'éditeur. En attendant,
# enabled: false (l'agent ne lance pas la source). Essai sans requête au site :
#   uv run python -m src.extractors.scrapers.source.agenda_scraper --fichier perso/frontignan_agenda.html
scraper_sources:
  - name: "Ville de Frontignan - Agenda"
    source_id: "frontignan_agenda"
    type: "scraper"
    # Demande d'autorisation envoyée le 14/10/2026 (formulaire de contact) :
    # « reproduction interdite sauf autorisation expresse » (mentions légales).
    enabled: false
    base_url: "https://www.frontignan.fr"
    start_urls: ["https://www.frontignan.fr/agenda/"]
    page_url_template: "https://www.frontignan.fr/agenda/page/{n}/"
    max_pages: 10                # « Résultats 1 à 12 sur 114 » le 14/10/2026
    respect_robots_txt: true
    request_delay_seconds: 2.0   # une page toutes les 2 s : 10 requêtes par nuit
    max_articles: 200
    city: "Frontignan"
    latitude: 43.4483
    longitude: 3.7546
    credit: "Ville de Frontignan"
    # La liste n'affiche que les jours (heure « 06:00 » par défaut pour les
    # événements sur plusieurs jours) : l'heure est ignorée.
    day_only: true
    # Fiches de la page de liste (dates au format schema.org) : la page de
    # chaque événement n'est pas ouverte.
    selectors:
      article: "article"
      title: "h2.entry-title"
      link: "h2.entry-title a"
      text: ".entry-summary p"
      start_date: "[itemprop=startDate]"
      end_date: "[itemprop=endDate]"
      category: ".entry-meta a"
    pagination:
      enabled: false             # pages « /page/N/ » : voir page_url_template
