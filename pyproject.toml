[project]
name = "sortiria"
version = "0.1.0"
description = "Assistant IA de recommandation de sorties à Montpellier (collecte CheckIt.AI + RAG)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Collecte (CheckIt.AI)
    "beautifulsoup4>=4.15.0",
    "extruct>=0.18.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pandas>=2.1.2",
    "psycopg2-binary>=2.9.10",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pypdf>=5.0.0",  # texte des programmes PDF (src/extractors/documents/)
    "openpyxl>=3.1.0",  # fichiers Excel des partenaires (src/extractors/datasets/source/)
    "xlrd>=2.0.1",  # ancien format Excel (.xls) des partenaires
    "mlflow>=3.1,<4",  # suivi des exécutions de l'agent (agent/tracking.py) ; MLflow 2.x est incompatible avec Airflow 3.3 (packaging) ; même version majeure que le serveur docker-compose
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tzdata>=2024.1",  # fuseau Europe/Paris sous Windows (zoneinfo)
    "w3lib>=2.4.1",
    # Recherche et API (FastAPI, Mistral par LangChain, agent LangGraph)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "langchain-mistralai>=0.2.0",
    "langgraph>=0.6.0",  # agent de collecte nocturne (comme Chess Agent)
]

[project.optional-dependencies]
airflow = [
    # Collecte en local seulement (dags/) ; la production utilise un Container
    # Apps Job. Plancher et non version figée (16/10/2026) : Airflow 3.3.0 avait
    # 12 alertes de sécurité (désérialisation, API) ; on suit les correctifs 3.x.
    "apache-airflow>=3.3.0,<4",
    "apache-airflow-providers-postgres>=6.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.22",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
# reference/ contient du code d'autres projets, à reprendre : il n'est pas vérifié.
extend-exclude = ["reference"]
