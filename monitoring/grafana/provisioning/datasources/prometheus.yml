# Configuration de la source Prometheus pour Grafana (métriques de l'API,
# bloc « production » ; le service prometheus n'est pas encore lancé).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy

    # Adresse interne du conteneur Prometheus.
    url: http://prometheus:9090

    # Source de données par défaut.
    isDefault: false
    editable: false