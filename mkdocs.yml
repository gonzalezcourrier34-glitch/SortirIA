# Documentation SortirIA (MkDocs + Material + mkdocstrings)
#
# Aperçu local :   uv run mkdocs serve
# Construction :   uv run mkdocs build --strict
#
# Les pages « Référence du code » (une par fichier Python, docs/reference/) sont
# générées à partir des docstrings numpy : chaque module indique d'où vient son
# code (section « Provenance »).

site_name: SortirIA
site_description: Assistant IA de recommandation de sorties à Montpellier
site_author: Stéphane Gonzalez
site_url: https://gonzalezcourrier34-glitch.github.io/SortirIA/
repo_url: https://github.com/gonzalezcourrier34-glitch/SortirIA
edit_uri: ""

theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Mode clair

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: fr
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "dags"]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_submodules: false
            members_order: source
            heading_level: 2
            filters: ["!^_"]

nav:
  - Accueil: index.md
  - Dossier du projet:
      - MVP et arbitrages: mvp.md
      - Feuille de route: feuille_de_route.md
      - Architecture: architecture.md
      - Évaluation: evaluation.md
      - Fiabilité des données: fiabilite.md
      - Coûts et projection: couts.md
  - Démarrage: demarrage.md
  - Sources d'événements: sources.md
  - Fichiers des partenaires: partenaires.md
  - Agent de collecte: agent.md
  - Interface: interface.md
  - Base de données: base_de_donnees.md
  - MLOps et monitoring: monitoring.md
  - Déploiement Azure: deploiement.md
