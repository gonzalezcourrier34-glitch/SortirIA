# ============================================================
# CD - Déploiement continu de SortirIA
#
# Provenance : repris de la CD du triage médical (projet 14).
#
# Objectif :
# Construire l'image de l'API FastAPI, la publier sur GHCR,
# puis la déployer sur Azure (16/10/2026) : API et collecte de
# la nuit (Container Apps), interface (Static Web Apps).
# ============================================================

name: CD

# ------------------------------------------------------------
# 1. Déclenchement après la réussite de la CI
# ------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

  # Autorise également un lancement manuel.
  workflow_dispatch:


# ------------------------------------------------------------
# 2. Permissions GitHub
# ------------------------------------------------------------

permissions:
  contents: read
  packages: write
# Un seul déploiement à la fois (30/10/2026) : deux pushes rapprochés lançaient
# deux CD ; la seconde échouait (« ContainerAppOperationInProgress »), la
# révision de la première étant encore en cours d'activation. La suivante attend.
concurrency:
  group: deploiement-production
  cancel-in-progress: false


# ------------------------------------------------------------
# 3. Construction et publication Docker
# ------------------------------------------------------------

jobs:

  build:
    name: Build & Publish
    runs-on: ubuntu-latest

    # Ne pas publier si la CI a échoué.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:

      # Récupère exactement le commit validé par la CI.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # Prépare Docker Buildx pour construire l'image.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification au registre GitHub.
      # GITHUB_TOKEN est fourni automatiquement par GitHub.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Détermine le nom et la version de l'image.
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          echo "image=ghcr.io/${REPO}/api:sha-${SHA}" >> "$GITHUB_OUTPUT"

      # Construit l'image FastAPI puis la publie.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.image }}

          # Réutilise le cache pour accélérer les builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max


# ------------------------------------------------------------
# 4. Déploiement sur Azure (16/10/2026)
# ------------------------------------------------------------
#
# Remplace le déploiement SSH hérité du triage médical. Actif quand la
# variable de dépôt DEPLOY_ENABLED vaut "true" (Settings > Secrets and
# variables > Actions > Variables).
#
# Connexion sans mot de passe (OpenID Connect) : GitHub prouve à Azure
# qu'il s'agit de ce dépôt et de la branche main ; Azure n'accepte que
# ce cas (identifiant fédéré) et ne donne accès qu'au groupe sortiria-rg.
# Secrets du dépôt (des identifiants, pas des mots de passe) :
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
# Mise en place : perso/deploiement_azure.md (étape 11).

  deploy:
    name: Deploy Azure
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # jeton OpenID Connect pour azure/login

    env:
      RESOURCE_GROUP: sortiria-rg
      API_APP: sortiria-api
      COLLECT_JOB: sortiria-collecte
      WEB_APP: sortiria-web
      SITE_URL: https://www.sortiria-montpellier.fr
      IMAGE: ${{ needs.build.outputs.image }}

    steps:

      # Le code du commit validé (pour compiler l'interface).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Nouvelle révision de l'API : secrets et réglages gardés.
      - name: Update API
        run: >
          az containerapp update
          --name "$API_APP" --resource-group "$RESOURCE_GROUP"
          --image "$IMAGE"
          --query properties.latestRevisionName -o tsv

      # La collecte de la nuit prend la même image (SOURCES_DESACTIVEES gardée).
      - name: Update nightly collection job
        run: >
          az containerapp job update
          --name "$COLLECT_JOB" --resource-group "$RESOURCE_GROUP"
          --image "$IMAGE"
          --query name -o tsv

      # Interface Angular : compilée puis envoyée sur Static Web Apps.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      # Le jeton d'envoi est lu dans Azure à chaque fois (pas de secret de plus)
      # et masqué dans les journaux.
      - name: Deploy frontend
        shell: bash
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$WEB_APP" --resource-group "$RESOURCE_GROUP" \
                  --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          npx --yes @azure/static-web-apps-cli deploy frontend/dist/sortiria-front/browser \
            --deployment-token "$TOKEN" --env production

      # Le site et l'API répondent (l'API dort sans visiteur : on lui laisse le
      # temps de se réveiller). /health n'est pas joignable de l'extérieur
      # (l'API n'accepte que les appels passés par le site) : on passe par lui.
      - name: Healthcheck
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
               "$SITE_URL/" -o /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors \
               "$SITE_URL/api/v1/sources" -o /dev/null
