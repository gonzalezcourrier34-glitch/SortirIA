# =============================================================================
# CI - Intégration continue de SortirIA
# =============================================================================
#
# Provenance : structure reprise de la CI de Chess Agent (projet 13),
# simplifiée pour SortirIA (pas de Milvus, Ollama ni Angular ici).
#
# À chaque push ou Pull Request, ce workflow vérifie que :
#   1. le code respecte les règles de qualité (Ruff) ;
#   2. les tests unitaires passent ;
#   3. l'image Docker de l'API se construit ;
#   4. la documentation MkDocs se construit sans erreur ;
#   5. la recherche respecte toujours les contraintes (≥ 95 %) sur une base
#      de test figée (16/10/2026).
#
# Si une étape échoue, la CI est rouge et la CD ne publie rien.
#
# À faire quand uv.lock sera commité : remplacer "uv sync" par
# "uv sync --frozen" pour garantir des dépendances identiques partout.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# La CI lit seulement le dépôt : permissions minimales.
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # 1. Qualité du code
  # ---------------------------------------------------------------------------
  # Ruff détecte les imports inutilisés, les noms non définis et les erreurs
  # de syntaxe. Le dossier reference/ est exclu : c'est du code à reprendre,
  # pas du code exécuté.
  quality:
    name: Qualité (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check --select E9,F63,F7,F82 --exclude reference .

  # ---------------------------------------------------------------------------
  # 2. Tests unitaires
  # ---------------------------------------------------------------------------
  # tests/conftest.py crée des secrets factices : aucune vraie clé d'API
  # n'est nécessaire, et aucun appel réseau réel n'est fait (tout est simulé).
  # Un vrai PostgreSQL avec pgvector (16/10/2026) : les tests du schéma
  # (tests/event/test_schema_postgres.py) et de la base de test tournent
  # aussi en CI, au lieu d'être ignorés faute de base.
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sortiria
          POSTGRES_PASSWORD: sortiria
          POSTGRES_DB: sortiria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sortiria -d sortiria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SORTIRIA_TEST_DATABASE_URL: postgresql://sortiria:sortiria@localhost:5432/sortiria_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Pytest avec couverture
        run: >
          uv run pytest
          --cov=src --cov=app
          --cov-report=term-missing
          --cov-report=xml
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # 3. Construction de l'image Docker de l'API
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v5
      - name: Build de l'image API
        run: docker build -f docker/Dockerfile.api -t sortiria-api:ci .

  # ---------------------------------------------------------------------------
  # 4. Documentation
  # ---------------------------------------------------------------------------
  # --strict fait échouer le build au moindre lien cassé ou page manquante.
  docs:
    name: Documentation (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # 5. Évaluation de la recherche (16/10/2026)
  # ---------------------------------------------------------------------------
  # Les 50 questions de config/eval_recherche.yaml sur une base figée
  # (tests/data/jeu_recherche.json.gz, exportée par
  # scripts/jeu_test_recherche.py --exporter), à l'instant de l'export, sans
  # vecteur ni Mistral : aucune clé, aucun coût. Le job échoue si la précision
  # ou la compréhension passe sous 95 %. Le rapport est gardé en artefact.
  eval-recherche:
    name: Évaluation de la recherche (≥ 95 %)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sortiria
          POSTGRES_PASSWORD: sortiria
          POSTGRES_DB: sortiria_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sortiria -d sortiria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sortiria:sortiria@localhost:5432/sortiria_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Chargement de la base de test
        run: uv run python -m scripts.jeu_test_recherche --charger
      - name: Évaluation (échoue sous 95 %)
        run: uv run python -m scripts.eval_recherche --jeu-test --seuil 0.95 --json eval_recherche.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-recherche
          path: eval_recherche.json
          if-no-files-found: ignore
