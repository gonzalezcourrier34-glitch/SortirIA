# =============================================================================
# CI - Intégration continue de SortirIA
# =============================================================================
#
# Provenance : structure reprise de la CI de Chess Agent (projet 13),
# simplifiée pour SortirIA (pas de Milvus, Ollama ni Angular ici).
#
# À chaque push ou Pull Request, ce workflow vérifie que :
#   1. le code respecte les règles de qualité (Ruff) ;
#   2. les tests unitaires passent ;
#   3. l'image Docker de l'API se construit ;
#   4. la documentation MkDocs se construit sans erreur.
#
# Si une étape échoue, la CI est rouge et la CD ne publie rien.
#
# À faire quand uv.lock sera commité : remplacer "uv sync" par
# "uv sync --frozen" pour garantir des dépendances identiques partout.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# La CI lit seulement le dépôt : permissions minimales.
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # 1. Qualité du code
  # ---------------------------------------------------------------------------
  # Ruff détecte les imports inutilisés, les noms non définis et les erreurs
  # de syntaxe. Le dossier reference/ est exclu : c'est du code à reprendre,
  # pas du code exécuté.
  quality:
    name: Qualité (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Ruff check
        run: uv run ruff check --select E9,F63,F7,F82 --exclude reference .

  # ---------------------------------------------------------------------------
  # 2. Tests unitaires
  # ---------------------------------------------------------------------------
  # tests/conftest.py crée des secrets factices : aucune vraie clé d'API
  # n'est nécessaire, et aucun appel réseau réel n'est fait (tout est simulé).
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - name: Pytest avec couverture
        run: >
          uv run pytest
          --cov=src --cov=app
          --cov-report=term-missing
          --cov-report=xml
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # 3. Construction de l'image Docker de l'API
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v5
      - name: Build de l'image API
        run: docker build -f docker/Dockerfile.api -t sortiria-api:ci .

  # ---------------------------------------------------------------------------
  # 4. Documentation
  # ---------------------------------------------------------------------------
  # --strict fait échouer le build au moindre lien cassé ou page manquante.
  docs:
    name: Documentation (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict
